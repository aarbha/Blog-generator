[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "blog-writer"
version = "2.0.0"
description = "AI-powered research + dynamic blogging"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "duckduckgo_search>=6.0.0",
    "trafilatura>=2.0.0",
    "feedparser>=6.0.0",
    "pydantic-settings>=2.0.0",
    "click>=8.0.0",
]

[project.scripts]
blog-writer = "main:cli"

[tool.setuptools]
py-modules = ["main", "blogger", "researcher", "scraper", "formatter", "medium", "server", "config"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
